<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escala de Grandes Eventos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escala">
<meta name="theme-color" content="#102a4c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Identidade: documento operacional. Marinho institucional, papel branco, cores só para situação. */
  :root{
    --navy:#102a4c; --navy2:#1c3d68; --ink:#16202c; --muted:#5b6775; --ground:#e9ecef; --paper:#fff; --rule:#d3d9e0;
    --ok:#1e6b3e; --okbg:#e6f2ea; --warn:#9a5b00; --warnbg:#fff6e5; --bad:#a4231b; --badbg:#fbeceb;
    --cond:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--ground);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  :focus-visible{outline:3px solid #6f9bd1;outline-offset:2px}

  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:3px solid #c9a227}
  header .t{flex:1;min-width:0}
  header .t b{display:block;font-family:var(--cond);font-size:19px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .t span{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:4px;padding:6px 10px;font:500 14px Barlow,sans-serif;cursor:pointer}
  #btnSino{position:relative;padding:6px 8px;line-height:0}
  #sinoN{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:3px;font:700 11px/18px Barlow,sans-serif;min-width:18px;height:18px;padding:0 4px;text-align:center;display:none}

  main{max-width:720px;margin:0 auto;padding:14px 14px 28px}
  .pn{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin-bottom:12px}
  h2{margin:0 0 10px;font-size:16px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .peq{font-size:14px}
  label{font-size:14px;font-weight:600;display:block;margin:12px 0 5px;color:var(--navy)}
  input{width:100%;padding:11px 12px;border:1px solid #b9c2cd;border-radius:4px;font:500 17px Barlow,sans-serif;background:#fff;color:var(--ink)}
  input:focus{border-color:var(--navy2);outline:2px solid #c9d8ec}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:4px;padding:11px 16px;font:600 16px Barlow,sans-serif;cursor:pointer;text-decoration:none;background:var(--navy2);color:#fff}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.full{width:100%;margin-top:14px}
  .btn.sec{background:#fff;color:var(--navy);border-color:#b9c2cd}
  .btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.warn{background:var(--warn)}
  .btn.sm{padding:7px 12px;font-size:14px}
  .btn.quieto{background:transparent;color:var(--muted);border-color:transparent;font-weight:500}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btns .btn{flex:1 1 auto}

  .st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
  .st:before{content:"";width:8px;height:8px;border-radius:1px;background:currentColor}
  .st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.n{color:var(--muted)}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--bad);color:#fff;vertical-align:1px}

  .msg{padding:10px 12px;border-radius:4px;margin-top:12px;font-size:15px;white-space:pre-line;border-left:4px solid}
  .msg.ok{background:var(--okbg);color:var(--ok)} .msg.bad{background:var(--badbg);color:var(--bad)} .msg.warn{background:var(--warnbg);color:var(--warn)}
  .msg svg.i{margin-right:6px}

  .linha{font-size:13px;color:var(--muted);margin:0 2px 10px;display:flex;align-items:center;gap:6px}
  .linha.off{background:var(--warnbg);color:var(--warn);padding:8px 10px;border-radius:4px;border-left:4px solid}

  .alerta{background:var(--paper);border:1px solid #e3b4b0;border-top:4px solid var(--bad);border-radius:4px;padding:14px 16px;margin-bottom:12px}
  .alerta h2{color:var(--bad)}
  .alerta ul{margin:4px 0 0;padding-left:18px} .alerta li{margin:5px 0}
  .de{text-decoration:line-through;color:var(--muted)} .para{font-weight:700}

  /* Bloco de apresentação: o elemento principal da tela */
  .apr{background:var(--navy);color:#fff;border-radius:4px;margin-bottom:12px;overflow:hidden}
  .apr .topo{padding:14px 16px 0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .apr .eq{font-family:var(--cond);font-size:20px;font-weight:600;line-height:1.15}
  .apr .fn{font-size:13px;opacity:.75;white-space:nowrap}
  .apr .quando{display:flex;align-items:flex-end;gap:14px;padding:6px 16px 12px}
  .apr .hr{font-family:var(--cond);font-size:58px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .apr .dt{font-size:15px;line-height:1.3;padding-bottom:4px}
  .apr .dt b{display:block;font-weight:600}
  .apr .dt span{opacity:.8}
  .cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#0b1f3a;border-top:1px solid rgba(255,255,255,.12);font-size:14px}
  .cr .v{font-family:var(--cond);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .cr.amar{background:#8a5200} .cr.verm{background:var(--bad)} .cr.fim{background:#3c4a5c}
  .cr.ok{background:var(--ok)} .cr.falta{background:var(--bad)}
  .cr .msgc{display:flex;align-items:center;gap:8px;font-weight:600}

  .avisos{background:var(--warnbg);border:1px solid #efd7a8;border-left:5px solid #c27c0e;border-radius:4px;padding:14px 16px;margin-bottom:12px}
  .avisos h2{color:#7a4700}
  .avisos .item{padding:10px 0;border-top:1px solid #efd7a8}
  .avisos .item:first-of-type{border-top:0;padding-top:2px}
  .avisos .meta{font-size:13px;color:#7a5a2b}
  .avisos .txt{margin-top:2px;color:#2b1d07}

  .tabs{display:flex;margin-bottom:12px;border:1px solid var(--navy2);border-radius:4px;overflow:hidden;background:#fff}
  .tabs button{flex:1;border:0;background:transparent;padding:9px 8px;font:600 15px Barlow,sans-serif;color:var(--navy2);cursor:pointer}
  .tabs button.on{background:var(--navy2);color:#fff}

  dl.ficha{margin:0;display:grid;grid-template-columns:190px 1fr}
  dl.ficha dt,dl.ficha dd{margin:0;padding:9px 0;border-top:1px solid var(--rule)}
  dl.ficha dt{font-weight:700;color:var(--navy);font-size:14px;padding-right:12px}
  dl.ficha dd{color:#2b3440}
  dl.ficha dt:first-of-type,dl.ficha dt:first-of-type + dd{border-top:0}
  dl.ficha .mud{background:var(--warnbg);box-shadow:-8px 0 0 var(--warnbg),8px 0 0 var(--warnbg)}
  @media(max-width:560px){dl.ficha{grid-template-columns:1fr} dl.ficha dd{border-top:0;padding-top:0}}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chips button{border:1px solid #b9c2cd;background:#fff;border-radius:3px;padding:5px 10px;font:500 14px Barlow,sans-serif;color:var(--ink);cursor:pointer}
  .cont{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}

  .lista .it{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--rule);cursor:pointer}
  .lista .it:first-child{border-top:0;padding-top:2px}
  .lista .it b{font-weight:600}

  .resumo{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:4px;margin-top:4px}
  .resumo div{padding:8px 6px;text-align:center;border-left:1px solid var(--rule)}
  .resumo div:first-child{border-left:0}
  .resumo b{display:block;font-family:var(--cond);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
  .resumo span{font-size:12px;color:var(--muted)}
  .pol{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 16px;margin:0 -16px;border-top:1px solid var(--rule)}
  .pol.ok{background:#f2f8f4;box-shadow:inset 4px 0 0 var(--ok)} .pol.flt{background:#fcf3f2;box-shadow:inset 4px 0 0 var(--bad)}
  .pol .pi{min-width:0;flex:1;font-size:15px}
  .pol .pi .muted{font-size:13px;margin:1px 0 4px}
  .pol .pa{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
  .bp{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:92px;border:1px solid var(--ok);border-radius:3px;padding:5px 8px;font:600 13px Barlow,sans-serif;cursor:pointer;background:var(--ok);color:#fff}
  .bp.flt{background:#fff;color:var(--bad);border-color:var(--bad)}
  .bp.des{background:transparent;border-color:transparent;color:var(--muted);text-decoration:underline;font-weight:500;min-width:0;padding:2px 0}
  .bp svg.i{width:14px;height:14px}
  .eqh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
  .eqh b{font-family:var(--cond);font-size:18px;font-weight:600;color:var(--navy)}

  .busca{margin-top:12px}
  .chk{display:flex;align-items:center;padding-right:2px} .chk input{width:22px;height:22px}
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .barra .btn{background:#c9a227;color:var(--navy)}
  .folha{align-items:stretch} .folha .qrcab{margin:0 auto} .form{width:100%;max-width:520px;margin:0 auto;padding-bottom:30px}
  .opcoes{border:1px solid var(--rule);border-radius:4px}
  .op{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border-top:1px solid var(--rule);font-weight:500;color:var(--ink);cursor:pointer}
  .op:first-child{border-top:0} .op input[type=radio]{width:20px;height:20px;margin-top:2px;flex-shrink:0}
  .op:has(input:checked){background:#eef3fa}
  .saidas{margin:10px -16px -14px;padding:10px 16px;background:#f6f7f9;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
  .saidas b{color:var(--ink);font-weight:600}
  .linha.ok{background:var(--okbg);color:var(--ok);padding:8px 10px;border-radius:4px;border-left:4px solid;font-weight:600}
  .qrtela{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;align-items:center;padding:16px;overflow:auto}
  .qrcab{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:10px}
  .qrcab b{font-family:var(--cond);font-size:22px;color:var(--navy)}
  .qrcaixa{width:min(86vw,420px);aspect-ratio:1;margin:18px 0 10px;display:flex;align-items:center;justify-content:center}
  .qrcaixa svg{width:100%;height:100%}
  .qrtxt{max-width:420px;text-align:center;font-size:16px}
  .qrinfo{max-width:420px;text-align:center;font-size:14px;color:var(--muted);margin-top:10px}
  .foot{font-size:13px;color:var(--muted);margin:18px 2px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px}
  @keyframes g{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
</style>
</head>
<body>
<header>
  <div class="t"><b id="hTitle">Escala de Grandes Eventos</b><span id="hSub"></span></div>
  <button id="btnSino" style="display:none" aria-label="Avisos"></button>
  <button id="btnTopo" style="display:none"></button>
</header>
<main id="app"></main>

<script>
/* =========================================================================
   App do policial – Escala de Grandes Eventos (piloto)
   Fala com o servidor (Apps Script) e guarda as escalas neste celular.
   ========================================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbxZHkLazVHqtsWfi8ci7cEeFP5pub1sxKdTPLLSFmyvNDHxgxQ1-hzZvk7QtkDR_xT5uw/exec';
var CHAVE = 'escala_ge_v1';
var MAX_ERROS = 5, BLOQ_MIN = 15;
var FUNC = {CMT_OP:'Cmt da Operação', CMT_SETOR:'Cmt de Setor', CMT_EQUIPE:'Cmt de Equipe', MEMBRO:'Integrante de equipe'};

/* ---------- ícones (traço simples) ---------- */
var IC = {
  sino:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  aviso:'<path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a3 3 0 0 1 0 6"/><path d="M19 6a7 7 0 0 1 0 12"/>',
  alerta:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  ok:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  sair:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  atual:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  relogio:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  mais:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  troca:'<path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 4 4"/><path d="m17 20 4-4-4-4"/><path d="M21 16H8a4 4 0 0 1-4-4"/>',
  qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>'
};
function ic(n){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'; }

/* ---------- memória do celular ---------- */
function ler(){ try{ return JSON.parse(localStorage.getItem(CHAVE)) || null; }catch(e){ return null; } }
var M = ler() || {sess:[], erros:[], bloqueio:0};
function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(M)); }catch(e){} }

/* ---------- comunicação com o servidor (com repetição automática) ---------- */
function chamar(q){
  return new Promise(function(ok){
    if (window.google && google.script && google.script.run){
      google.script.run.withSuccessHandler(function(r){ ok(r || {ok:false, erro:'FALHA_SERVIDOR'}); })
        .withFailureHandler(function(){ ok({ok:false, erro:'SEM_CONEXAO'}); }).api(q);
    } else {
      var ctl = window.AbortController ? new AbortController() : null, t = setTimeout(function(){ if (ctl) ctl.abort(); }, 30000);
      fetch(API_URL, {method:'POST', body:JSON.stringify(q), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal: ctl ? ctl.signal : undefined})
        .then(function(r){ return r.json(); }).then(function(r){ clearTimeout(t); ok(r); })
        .catch(function(){ clearTimeout(t); ok({ok:false, erro:'SEM_CONEXAO'}); });
    }
  });
}
function api(q, tentativas){
  tentativas = tentativas || 4;
  return chamar(q).then(function(r){
    var repetir = !r.ok && (r.erro === 'FALHA_SERVIDOR' || r.erro === 'SEM_CONEXAO');
    if (repetir && tentativas > 1){
      return new Promise(function(z){ setTimeout(z, 1200 + Math.random()*2500); }).then(function(){ return api(q, tentativas-1); });
    }
    return r;
  });
}

/* ---------- utilidades ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dig(s){ return String(s || '').toUpperCase().replace(/[^0-9X]/g, ''); }   // matrícula: números e X
function hora(ts){ return new Date(ts).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}).replace(',', ' às'); }
function hm(ts){ return new Date(ts).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function fone(t){ if(!t) return ''; var d=t.slice(-11); return d.length===11 ? '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7) : t; }
function sessao(ev, mat){ for (var i=0;i<M.sess.length;i++) if (M.sess[i].ev===ev && M.sess[i].mat===mat) return M.sess[i]; return null; }
function tirar(s){ M.sess = M.sess.filter(function(x){ return x !== s; }); salvar(); }
function dataPorExtenso(txt){
  var md = String(txt || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (!md) return esc(txt || '');
  var t = new Date(+md[3], +md[2]-1, +md[1]).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function campo(d, nome){ var k = (d.ficha || []).filter(function(x){ return x[0] === nome; })[0]; return k ? k[1] : ''; }
var atual = null, aba = 'ficha', avisosApp = [], ocupado = false, naoVaiAberto = false, tropaCache = null;

function topo(t, sub, botao, acao){
  $('#hTitle').textContent = t || 'Escala de Grandes Eventos';
  $('#hSub').textContent = sub || 'Consulta por matrícula e código do evento';
  $('#btnSino').style.display = 'none';
  var b = $('#btnTopo');
  if (botao){ b.style.display=''; b.textContent=botao; b.onclick=acao; } else b.style.display='none';
}
function inicio(){
  if (fazerCheckin()) return;
  if (qrPendente){ avisosApp.push('Entre com sua matrícula e o código do evento para registrar sua apresentação. Depois leia o QR do seu Cmt de novo, se for preciso.'); return telaEntrar(); }
  if (M.sess.length) telaMinhas(); else telaEntrar();
}
function avisosDoApp(){ var h = avisosApp.map(function(a){ return '<div class="msg warn" style="margin:0 0 12px">'+esc(a)+'</div>'; }).join(''); avisosApp = []; return h; }

/* ============ ENTRAR ============ */
function telaEntrar(msg){
  atual = null; topo(null, null, M.sess.length ? 'Minhas escalas' : null, telaMinhas);
  var bloq = M.bloqueio > Date.now();
  $('#app').innerHTML = avisosDoApp() +
    '<div class="pn"><h2>Consulte sua escala</h2>' +
    '<div class="muted peq">Use sua matrícula e o código do evento divulgado no boletim ou no briefing.</div>' +
    '<form id="fE" autocomplete="off">' +
      '<label for="iM">Matrícula</label><input id="iM" inputmode="text" autocapitalize="characters" required '+(bloq?'disabled':'')+'>' +
      '<label for="iC">Código do evento</label><input id="iC" style="text-transform:uppercase" autocapitalize="characters" required '+(bloq?'disabled':'')+'>' +
      '<button class="btn full" id="bE" type="submit" '+(bloq?'disabled':'')+'>Acessar minha escala</button>' +
      (bloq ? '<div class="msg bad">Acesso bloqueado após várias tentativas erradas. Tente novamente às '+new Date(M.bloqueio).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.</div>'
            : (msg ? '<div class="msg '+msg[0]+'">'+esc(msg[1])+'</div>' : '')) +
    '</form></div>' +
    '<div class="foot">Depois do primeiro acesso, sua escala fica salva neste celular.</div>';
  $('#fE').onsubmit = function(ev){
    ev.preventDefault(); if (ocupado) return;
    var mat = dig($('#iM').value), cod = $('#iC').value.trim().toUpperCase();
    if (!mat || !cod) return;
    ocupado = true; var b = $('#bE'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Consultando';

/* ============ ESCALA ============ */

    if (atual !== s) return;
    if (r.ok){ s.dados = r; s.em = Date.now(); salvar(); return telaEscala(true); }
    if (r.erro === 'ENCERRADO'){ avisosApp.push('O evento “'+(r.nome || (s.dados && s.dados.ev.nome) || '')+'” foi encerrado e saiu do seu app.'); tirar(s); return telaMinhas(); }

    if (r.erro === 'SESSAO_INVALIDA'){ avisosApp.push('Acesse de novo com sua matrícula e o código do evento.'); tirar(s); return telaEntrar(); }

    if (r.ok){ s.dados.estado = r.estado; salvar(); telaEscala(true); }
    else { telaEscala(true); erroFaixa('Não foi possível enviar agora. Tente de novo.'); }

}

/* ============ CONTAGEM ATÉ A APRESENTAÇÃO ============ */
function horaApresentacao(d){
  var md = String(d.ev.data || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  var mh = String((d.equipe && d.equipe.h) || '').match(/(\d{1,2})\s*[:hH]\s*(\d{2})?/);
  if (!md || !mh) return null;
  return new Date(+md[3], +md[2]-1, +md[1], +mh[1], +(mh[2]||0), 0).getTime();
}
function dois(n){ return (n<10?'0':'')+n; }
var cronoTimer = null;
function cronometro(){
  if (cronoTimer){ clearInterval(cronoTimer); cronoTimer = null; }
  var el = $('#crono'); if (!el || !atual || !atual.dados) return;
  var alvo = horaApresentacao(atual.dados);
  if (!alvo){ el.style.display = 'none'; return; }
  function tic(){
    var el = $('#crono'); if (!el){ clearInterval(cronoTimer); cronoTimer = null; return; }
    var falta = alvo - Date.now(), pr = atual.dados.estado && atual.dados.estado.pres;
    if (pr){
      el.className = 'cr ' + (pr.f ? 'falta' : 'ok');
      el.innerHTML = '<span class="msgc">'+ic(pr.f ? 'x' : 'ok')+(pr.f ? 'Falta registrada' : 'Apresentação registrada')+'</span><span>'+hm(pr.ts)+', por '+esc(String(pr.por||'seu Cmt').replace(/\s*\(.*\)$/, ''))+'</span>';
      clearInterval(cronoTimer); cronoTimer = null; return;
    }
    if (falta <= 0){
      el.className = 'cr fim';
      el.innerHTML = '<span class="msgc">'+ic('relogio')+'Horário de apresentação atingido</span>';
      clearInterval(cronoTimer); cronoTimer = null; return;
    }
    var s = Math.floor(falta/1000), dd = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sg = s%60;
    var urg = falta < 30*60000 ? 'verm' : falta < 2*3600000 ? 'amar' : '';
    el.className = 'cr ' + urg;
    el.innerHTML = '<span>'+(urg === 'verm' ? 'Dirija-se ao local. Faltam' : 'Faltam')+'</span><span class="v">'+(dd ? dd+(dd>1?' dias ':' dia ') : '')+dois(h)+':'+dois(m)+':'+dois(sg)+'</span>';
  }
  tic(); cronoTimer = setInterval(tic, 1000);
}

          var chk = selRem && podeRem ? '<label class="chk"><input type="checkbox" data-sel="'+x.m+'"'+(selRem[x.m]?' checked':'')+'></label>' : '';
          var ap = x.pres ? '<span class="st '+(x.pres.f?'bad':'ok')+'">'+(x.pres.f?'Falta':'Presente')+' '+hm(x.pres.ts)+(/QR\)$/.test(x.pres.por||'')?' (QR)':'')+'</span><button class="bp des" data-pres="'+x.m+'" data-v="0">desfazer</button>'
                 : (passou ? '<span class="st warn">Sem registro</span>' : '') + '<button class="bp flt" data-pres="'+x.m+'" data-v="F">'+ic('x')+'Falta</button><button class="bp" data-pres="'+x.m+'" data-v="1">'+ic('ok')+'Presente</button>';
          if (podeRem && !selRem) ap += '<button class="bp des" data-rem="'+x.m+'">remanejar</button>';
          return '<div class="pol'+(x.pres?(x.pres.f?' flt':' ok'):'')+'" data-busca="'+esc((x.n+' '+x.m).toLowerCase())+'">'+chk+'<div class="pi"><b>'+esc(x.n)+'</b><div class="muted">Mat. '+x.m+', '+esc(x.o)+(x.v?', '+esc(x.v):'')+(x.f!=='MEMBRO'?', '+esc(FUNC[x.f]):'')+(x.tel?'<br><a href="tel:'+x.tel+'">'+fone(x.tel)+'</a>':'')+'</div>' +
            veio + '<span class="st '+s[0]+'">'+esc(s[1])+'</span>'+(x.semCiencia?' <span class="st warn">sem ciência</span>':'')+'</div><div class="pa">'+ap+'</div></div>'; }).join('') + lote +
        (saidas.length ? '<div class="saidas"><b>Remanejados desta equipe</b>' + saidas.map(function(m){ return '<div>'+esc(m.n)+' → '+esc(nomeEq(r, m.para))+' às '+hm(m.ts)+'</div>'; }).join('') + '</div>' : '') +
        '</div>'; }).join('');
}
function nomeEq(r, id){ return (r.eqs[id] || {}).n || id; }
function ultimosRmj(r){ var u = {}; (r.rmj || []).forEach(function(m){ if (!u[m.m] || u[m.m].ts <= m.ts) u[m.m] = m; }); return Object.keys(u).map(function(k){ return u[k]; }); }
function ultimoRmj(r, mat){ var u = null; (r.rmj || []).forEach(function(m){ if (m.m === mat && (!u || u.ts <= m.ts)) u = m; }); return u; }
function barraSelecao(){
  var b = $('#barraRem'); if (b) b.remove();
  if (!selRem) return;
  var n = Object.keys(selRem).length;
  b = document.createElement('div'); b.id = 'barraRem'; b.className = 'barra';
  b.innerHTML = '<span>'+n+' selecionado(s)</span><button class="btn sm" id="bRemSel" '+(n?'':'disabled')+'>'+ic('troca')+'Remanejar</button>';
  document.body.appendChild(b);
  $('#bRemSel').onclick = function(){ abrirRemanejar(Object.keys(selRem)); };
}
function abrirRemanejar(mats){
  var r = tropaCache, s = atual; if (!r || !mats.length) return;
  var pols = r.lista.filter(function(x){ return mats.indexOf(x.m) >= 0; });
  var deUmaEquipe = pols.every(function(x){ return x.e === pols[0].e; }) ? pols[0].e : null;
  var o = document.createElement('div'); o.id = 'remTela'; o.className = 'qrtela folha';
  var cmtDe = function(id){ var c = r.lista.filter(function(x){ return x.e === id && x.f === 'CMT_EQUIPE'; })[0]; return c ? c.n : ''; };
  o.innerHTML = '<div class="qrcab"><b>Remanejar</b><button class="btn sec sm" id="bRemFecha">'+ic('x')+'Cancelar</button></div>' +
    '<div class="form">' +
    '<h2 style="margin-top:14px">'+(pols.length > 1 ? pols.length+' policiais' : esc(pols[0].n))+'</h2>' +
    '<div class="muted peq">'+pols.map(function(x){ return esc(x.n)+' ('+esc(nomeEq(r, x.e))+')'; }).join('<br>')+'</div>' +
    '<label>Para qual equipe?</label><div class="opcoes">' +
      r.destinos.filter(function(id){ return id !== deUmaEquipe; }).map(function(id, i){ var E = r.eqs[id] || {}; var c = cmtDe(id);
        return '<label class="op"><input type="radio" name="dest" value="'+esc(id)+'"><span><b>'+esc(E.n || id)+'</b><br><span class="muted peq">'+(E.h ? 'Apresentação '+esc(E.h) : '')+(c ? (E.h?', ':'')+'Cmt '+esc(c) : '')+'</span></span></label>'; }).join('') +
    '</div>' +
    '<label>Viatura</label><div class="opcoes">' +
      '<label class="op"><input type="radio" name="vtr" value="MANTER" checked><span>Manter a atual</span></label>' +
      '<label class="op"><input type="radio" name="vtr" value=""><span>Sem viatura (a pé)</span></label>' +
      '<label class="op"><input type="radio" name="vtr" value="OUTRA"><span>Outra: <input id="iVtr" maxlength="30" placeholder="Ex.: VTR 14.402" style="width:auto;padding:6px 8px;font-size:15px"></span></label>' +
    '</div>' +
    '<label for="iMot">Motivo (opcional)</label><input id="iMot" maxlength="40" placeholder="Ex.: reforço no portão sul">' +
    '<div class="msg warn" id="remResumo" style="display:none"></div>' +
    '<button class="btn full" id="bRemOk" disabled>Confirmar remanejamento</button>' +
    '<div class="muted peq" style="margin-top:8px">O policial recebe o aviso “Você foi remanejado” com a nova equipe, local e Cmt. A presença dele continua valendo.</div>' +
    '</div>';
  document.body.appendChild(o);
  function fechar(){ o.remove(); }
  $('#bRemFecha').onclick = fechar;
  function atualizarResumo(){
    var d = o.querySelector('input[name=dest]:checked');
    $('#bRemOk').disabled = !d;
    if (d){ var z = $('#remResumo'); z.style.display = ''; z.textContent = (pols.length > 1 ? pols.length+' policiais' : pols[0].n) + ' irão para ' + nomeEq(r, d.value) + '.'; }
  }
  o.querySelectorAll('input[name=dest]').forEach(function(i){ i.onchange = atualizarResumo; });
  $('#iVtr').onfocus = function(){ o.querySelector('input[name=vtr][value=OUTRA]').checked = true; };
  $('#bRemOk').onclick = function(){
    var d = o.querySelector('input[name=dest]:checked'); if (!d) return;
    var vv = o.querySelector('input[name=vtr]:checked').value, vtr = vv === 'OUTRA' ? ($('#iVtr').value.trim() || 'MANTER') : vv;
    var b = $('#bRemOk'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Remanejando';
    api({acao:'remanejar', ev:s.ev, mat:s.mat, tk:s.tk, alvos:mats.join(','), destino:d.value, vtr:vtr, motivo:$('#iMot').value.trim()}).then(function(res){
      if (!res.ok){ b.disabled = false; b.textContent = 'Confirmar remanejamento'; var z = $('#remResumo'); z.style.display=''; z.className='msg bad'; z.textContent = res.erro === 'NADA_A_FAZER' ? 'Nenhum policial para mover (já estão nessa equipe).' : 'Não foi possível remanejar agora. Tente de novo.'; return; }
      fechar(); selRem = null; barraSelecao();
      tropaCache = null; telaEscala(true); carregarTropa();
      setTimeout(function(){ var f = $('#faixa'); if (f){ f.className = 'linha ok'; f.innerHTML = ic('ok') + res.feitos.length + ' policial(is) remanejado(s) para ' + esc(nomeEq(r, d.value)) + '.'; } }, 50);
    });
  };
}
function filtrarTropa(){
  var t = buscaTropa.trim().toLowerCase();
  document.querySelectorAll('.pol[data-busca]').forEach(function(el){ el.style.display = !t || el.dataset.busca.indexOf(t) >= 0 ? '' : 'none'; });
}
function redesenharTropa(){ var el = $('#tropa'); if (el && tropaCache){ el.innerHTML = htmlTropa(tropaCache); ligarPresenca(); } }
function ligarPresenca(){
  var bu = $('#iBusca'); if (bu){ bu.oninput = function(){ buscaTropa = bu.value; filtrarTropa(); }; filtrarTropa(); }
  var at = $('#bAtTropa'); if (at) at.onclick = function(){ tropaCache = null; telaEscala(true); carregarTropa(); };
  var bq = $('#bQR'); if (bq) bq.onclick = abrirQR;
  var bs = $('#bSelRem'); if (bs) bs.onclick = function(){ selRem = {}; redesenharTropa(); };
  var bx = $('#bSelSair'); if (bx) bx.onclick = function(){ selRem = null; redesenharTropa(); };
  document.querySelectorAll('[data-sel]').forEach(function(c){ c.onchange = function(){ if (c.checked) selRem[c.dataset.sel] = 1; else delete selRem[c.dataset.sel]; barraSelecao(); }; });
  document.querySelectorAll('[data-rem]').forEach(function(b){ b.onclick = function(){ abrirRemanejar([b.dataset.rem]); }; });
  document.querySelectorAll('[data-desrmj]').forEach(function(b){ b.onclick = function(){
    var m = ultimoRmj(tropaCache, b.dataset.desrmj), s = atual; if (!m) return;
    b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    api({acao:'remanejar', ev:s.ev, mat:s.mat, tk:s.tk, alvos:m.m, destino:m.de, vtr:m.vtr, motivo:'Desfeito'}).then(function(res){
      tropaCache = null; telaEscala(true); carregarTropa();
      if (!res.ok) setTimeout(function(){ erroFaixa('Não foi possível desfazer agora. Tente de novo.'); }, 50);
    });
  }; });
  barraSelecao();
  document.querySelectorAll('[data-lote]').forEach(function(b){
    b.onclick = function(){
      var e = b.dataset.lote;
      if (b.dataset.ok === '0'){ confLote = null; return redesenharTropa(); }
      if (b.dataset.ok !== '1'){ confLote = e; return redesenharTropa(); }
      confLote = null;
      var s = atual, alvos = tropaCache.lista.filter(function(x){ return x.e === e && !x.pres; }).map(function(x){ return x.m; });
      b.disabled = true; b.innerHTML = '<span class="spin"></span> Registrando';
      api({acao:'presencaLote', ev:s.ev, mat:s.mat, tk:s.tk, alvos:alvos.join(',')}).then(function(r){
        if (atual !== s || !tropaCache) return;
        if (r.ok) tropaCache.lista.forEach(function(x){ if (r.pres[x.m]) x.pres = r.pres[x.m]; });
        redesenharTropa();
        if (!r.ok) erroFaixa('Não foi possível registrar agora. Tente de novo.');
      });
    };
  });
  document.querySelectorAll('[data-pres]').forEach(function(b){
    b.onclick = function(){
      var s = atual, alvo = b.dataset.pres, v = b.dataset.v === '1', fl = b.dataset.v === 'F';
      b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      api({acao:'presenca', ev:s.ev, mat:s.mat, tk:s.tk, alvo:alvo, presente:v, falta:fl}).then(function(r){
        if (atual !== s || !tropaCache) return;
        if (r.ok) tropaCache.lista.forEach(function(x){ if (x.m === alvo) x.pres = r.pres; });
        redesenharTropa();
        if (!r.ok) erroFaixa('Não foi possível registrar agora. Tente de novo.');
      });
    };
  });
}

/* ============ QR DE APRESENTAÇÃO (Cmt mostra, policial lê com a câmera) ============ */
var APP_URL = 'https://antonielinv.github.io/escala-app/';
var qrTimer = null, qrTropaTimer = null, qrLib = null;
function carregarLibQR(){
  if (window.qrcode) return Promise.resolve();
  if (qrLib) return qrLib;
  qrLib = new Promise(function(ok, falha){
    var urls = ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'];
    (function tenta(i){
      if (i >= urls.length){ qrLib = null; return falha(); }
      var sc = document.createElement('script'); sc.src = urls[i];
      sc.onload = function(){ window.qrcode ? ok() : tenta(i+1); }; sc.onerror = function(){ tenta(i+1); };
      document.head.appendChild(sc);
    })(0);
  });
  return qrLib;
}
function fecharQR(){
  if (qrTimer){ clearInterval(qrTimer); qrTimer = null; }
  if (qrTropaTimer){ clearInterval(qrTropaTimer); qrTropaTimer = null; }
  var o = $('#qrTela'); if (o) o.remove();
  redesenharTropa();
}
function abrirQR(){
  var s = atual; if (!s) return;
  var o = document.createElement('div'); o.id = 'qrTela'; o.className = 'qrtela';
  o.innerHTML = '<div class="qrcab"><b>QR de apresentação</b><button class="btn sec sm" id="bFechaQR">'+ic('x')+'Fechar</button></div>' +
    '<div class="qrcaixa" id="qrImg"><span class="spin"></span></div>' +
    '<div class="qrtxt">Policiais da sua tropa: apontem a câmera do celular para este código e toquem no link que aparecer.</div>' +
    '<div class="qrinfo" id="qrInfo">Gerando código</div>';
  document.body.appendChild(o);
  $('#bFechaQR').onclick = fecharQR;
  function gerar(){
    if (!$('#qrTela')) return;
    Promise.all([carregarLibQR(), api({acao:'qr', ev:s.ev, mat:s.mat, tk:s.tk}, 2)]).then(function(res){
      var r = res[1], box = $('#qrImg'); if (!box) return;
      if (!r.ok){ $('#qrInfo').textContent = 'Não foi possível gerar o código. Verifique a internet.'; return; }
      var q = qrcode(0, 'M'); q.addData(APP_URL + '?ev=' + encodeURIComponent(s.ev) + '&qr=' + encodeURIComponent(r.qr)); q.make();
      box.innerHTML = q.createSvgTag({cellSize: 8, margin: 2, scalable: true});
      $('#qrInfo').textContent = 'O código se renova sozinho a cada minuto.';
    }, function(){ var i = $('#qrInfo'); if (i) i.textContent = 'Não foi possível carregar o gerador de QR. Verifique a internet.'; });
  }
  gerar(); qrTimer = setInterval(gerar, 60000);
  qrTropaTimer = setInterval(function(){                       // acompanha quem já se apresentou
    api({acao:'tropa', ev:s.ev, mat:s.mat, tk:s.tk}, 1).then(function(r){
      if (!r.ok || !$('#qrTela')) return;
      tropaCache = r;
      var p = r.lista.filter(function(x){ return x.pres && !x.pres.f; }).length;
      var i = $('#qrInfo'); if (i) i.innerHTML = '<b>'+p+' de '+r.lista.length+'</b> presentes. O código se renova sozinho a cada minuto.';
    });
  }, 15000);
}

/* ============ POLICIAL: LEU O QR DO CMT ============ */
var qrPendente = null;
(function(){
  try {
    var u = new URLSearchParams(location.search);
    if (u.get('qr') && u.get('ev')) qrPendente = {ev: u.get('ev'), qr: u.get('qr')};
    if (u.get('qr')) history.replaceState(null, '', location.pathname);
  } catch(e){}
})();
var ERRO_QR = {QR_VENCIDO:'Este QR venceu. Peça ao seu Cmt para mostrar o código de novo e leia outra vez.',
  QR_INVALIDO:'QR inválido. Leia o código direto da tela do seu Cmt.',
  FORA_DA_TROPA:'Este QR é de um Cmt que não comanda você. Procure o Cmt da sua equipe.'};
function fazerCheckin(){
  if (!qrPendente) return false;
  var p = qrPendente, s = M.sess.filter(function(x){ return x.ev === p.ev; })[0];
  if (!s) return false;
  qrPendente = null; atual = s; aba = 'ficha'; tropaCache = null; telaEscala(true);
  var f = $('#faixa'); if (f){ f.className = 'linha'; f.innerHTML = '<span class="spin"></span> Registrando sua apresentação'; }
  api({acao:'checkin', ev:s.ev, mat:s.mat, tk:s.tk, qr:p.qr}).then(function(r){
    if (atual !== s) return;
    if (r.ok){ s.dados.estado.pres = r.pres; salvar(); telaEscala(true);
      var f = $('#faixa'); if (f){ f.className = 'linha ok'; f.innerHTML = ic('ok') + (r.ja ? 'Sua apresentação já estava registrada.' : 'Apresentação registrada às ' + hm(r.pres.ts) + '.'); } }
    else erroFaixa(ERRO_QR[r.erro] || 'Não foi possível registrar agora. Leia o QR de novo.');
  });
  return true;
}

/* ============ SAIR ============ */
var saiu = false;
function sair(){
  saiu = true; atual = null;
  if (cronoTimer){ clearInterval(cronoTimer); cronoTimer = null; }
  topo('Escala de Grandes Eventos', 'Sessão encerrada neste celular');
  $('#app').innerHTML = '<div class="pn"><h2>'+ic('sair')+'Você saiu do aplicativo</h2>' +
    '<div class="muted">O app parou de consultar o servidor. Sua escala continua salva neste celular e você já pode fechar esta aba.</div>' +
    '<button class="btn full" id="bVoltar">Abrir novamente</button></div>';
  $('#bVoltar').onclick = function(){ saiu = false; inicio(); };
  try { window.close(); } catch(e){}
}

/* ============ ATUALIZAÇÃO AUTOMÁTICA ============ */
document.addEventListener('visibilitychange', function(){ if (!saiu && !document.hidden && atual && !ocupado && Date.now() - (atual.em || 0) > 2*60000) atualizar(true); });
setInterval(function(){ if (!saiu && !document.hidden && atual && !ocupado && !naoVaiAberto) atualizar(true); }, 5*60000);
inicio();
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
